# Sites shown in the app (PLAN.md §7). Planetocentric latitude, east longitude, degrees.
# kind: exact  = a point published by the cited source
#       approx = a representative point chosen to stand for a region (method given in `point`)
# Heights are not listed here: scripts/sites.py samples them from the LOLA 10 m map.

sites:
  # Artemis candidate landing regions (NASA, Oct 2024). NASA publishes footprints, not points.
  - id: peak-near-cabeus-b
    name: Peak near Cabeus B
    group: artemis
    lat: -83.6
    lon: -68.8
    kind: approx
    point: Highest LOLA point within 7.5 km of the LROC NAC mosaic center (the 2024 footprint was not available). lat/lon below is the mosaic center.
    highest_within_km: 7.5
    source: LROC NAC ROI CABEUSPKLO1_P836S2912
    url: https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/DATA/BDR/NAC_ROI/
    notes: Region added in 2024. Its official footprint is in the USGS data release (doi:10.5066/P1MEQ6UK).

  - id: haworth
    name: Haworth
    group: artemis
    lat: -86.7639
    lon: -22.7770
    kind: approx
    point: Highest LOLA point inside the region footprint (2022 list, served by NASA Moon Trek). lat/lon below is the footprint centroid.
    footprint: Haworth
    source: NASA Moon Trek, A3_Named_regions_SP
    url: https://trek.nasa.gov/moon/trekarcgis2/rest/services/A3_Named_regions_SP/MapServer/0

  - id: malapert-massif
    name: Malapert Massif
    group: artemis
    lat: -85.9948
    lon: -0.2358
    kind: approx
    point: Highest LOLA point inside the region footprint (2022 list, served by NASA Moon Trek). lat/lon below is the footprint centroid.
    footprint: Malapert Massif
    source: NASA Moon Trek, A3_Named_regions_SP
    url: https://trek.nasa.gov/moon/trekarcgis2/rest/services/A3_Named_regions_SP/MapServer/0
    notes: Intuitive Machines IM-5 plans to land at Mons Malapert (no coordinates published).

  - id: mons-mouton-plateau
    name: Mons Mouton Plateau
    group: artemis
    lat: -84.3
    lon: 30.6
    kind: approx
    point: Highest LOLA point within 7.5 km of the LROC NAC mosaic center (the 2024 footprint was not available). lat/lon below is the mosaic center.
    highest_within_km: 7.5
    source: LROC NAC ROI MOUTNPLTLO1_P843S0306
    url: https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/DATA/BDR/NAC_ROI/
    notes: Region added in 2024. A large region; the IM-2 landing site lies inside the mosaic.

  - id: mons-mouton
    name: Mons Mouton
    group: artemis
    lat: -85.4266
    lon: 31.7428
    kind: approx
    point: Highest LOLA point inside the region footprint (2022 list, served by NASA Moon Trek). lat/lon below is the footprint centroid. The 2022 list calls this region "Leibnitz Beta Plateau".
    footprint: Leibnitz Beta Plateau
    source: NASA Moon Trek, A3_Named_regions_SP
    url: https://trek.nasa.gov/moon/trekarcgis2/rest/services/A3_Named_regions_SP/MapServer/0
    notes: Intuitive Machines IM-4 plans to land at Mons Mouton in 2027 (no coordinates published).

  - id: nobile-rim-1
    name: Nobile Rim 1
    group: artemis
    lat: -85.4381
    lon: 37.3667
    kind: approx
    point: Highest LOLA point inside the region footprint (2022 list, served by NASA Moon Trek). lat/lon below is the footprint centroid.
    footprint: Nobile Rim 1
    source: NASA Moon Trek, A3_Named_regions_SP
    url: https://trek.nasa.gov/moon/trekarcgis2/rest/services/A3_Named_regions_SP/MapServer/0
    notes: Astrobotic's Griffin Mission One targets the Nobile crater region (no coordinates published).

  - id: nobile-rim-2
    name: Nobile Rim 2
    group: artemis
    lat: -83.9540
    lon: 58.8221
    kind: approx
    point: Highest LOLA point inside the region footprint (2022 list, served by NASA Moon Trek). lat/lon below is the footprint centroid.
    footprint: Nobile Rim 2
    source: NASA Moon Trek, A3_Named_regions_SP
    url: https://trek.nasa.gov/moon/trekarcgis2/rest/services/A3_Named_regions_SP/MapServer/0

  - id: de-gerlache-rim-2
    name: de Gerlache Rim 2
    group: artemis
    lat: -88.2300
    lon: -64.6284
    kind: approx
    point: Highest LOLA point inside the region footprint (2022 list, served by NASA Moon Trek). lat/lon below is the footprint centroid.
    footprint: de Gerlache Rim 2
    source: NASA Moon Trek, A3_Named_regions_SP
    url: https://trek.nasa.gov/moon/trekarcgis2/rest/services/A3_Named_regions_SP/MapServer/0

  # High-illumination points from the literature
  - id: connecting-ridge
    name: Connecting ridge
    group: illumination
    lat: -89.4398
    lon: -137.17
    kind: exact
    point: Point C1 of Gläser et al. 2018 (same spot as Gläser et al. 2014 CR1 spot 2)
    source: Gläser et al. 2018, Planetary and Space Science 162
    url: https://ntrs.nasa.gov/api/citations/20170007365/downloads/20170007365.pdf
    notes: Published 88.0% mean solar illumination at 2 m, 2017–2037. Blue Origin's Blue Moon MK1 pathfinder targets the Shackleton connecting ridge (no coordinates published).

  - id: shackleton-rim
    name: Shackleton rim
    group: illumination
    lat: -89.6866
    lon: -162.81
    kind: exact
    point: Shackleton rim point of Gläser et al. 2018
    source: Gläser et al. 2018, Planetary and Space Science 162
    url: https://ntrs.nasa.gov/api/citations/20170007365/downloads/20170007365.pdf
    notes: Published 85.5% mean solar illumination at 2 m, 2017–2037.

  # CLPS landing sites
  - id: im2-athena
    name: IM-2 Athena landing site
    group: clps
    lat: -84.7906
    lon: 29.1957
    kind: exact
    point: Where Intuitive Machines' Athena lander came to rest on 6 Mar 2025
    source: LROC image release 1408
    url: https://lroc.im-ldi.com/images/1408
    notes: Athena landed on its side in a small crater about 250 m from its target.

  - id: viper
    name: VIPER mission area
    group: clps
    lat: -85.42088
    lon: 31.6218
    kind: exact
    point: Center of VIPER's planned mission area (about 5 × 4 km)
    source: Planetary Science Journal, doi:10.3847/PSJ/ae061a
    url: https://iopscience.iop.org/article/10.3847/PSJ/ae061a
    notes: VIPER is now scheduled on Blue Origin's second Blue Moon MK1 (CLPS task order CS-7, late 2027). NASA has not confirmed whether this area is kept.

  # Contrast site for Explore mode
  - id: shackleton-floor
    name: Shackleton crater floor
    group: contrast
    lat: -89.67
    lon: 129.78
    kind: approx
    point: Lowest LOLA point within 3 km of the IAU crater center (89.67°S, 129.78°E); set by scripts/sites.py
    source: IAU Gazetteer of Planetary Nomenclature; LOLA 10 m map
    url: https://planetarynames.wr.usgs.gov/
    notes: Permanently shadowed. Included to contrast with the sunlit rim a few kilometres away.
    snap_to_min_within_km: 3.0

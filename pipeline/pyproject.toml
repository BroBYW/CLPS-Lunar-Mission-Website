[project]
name = "clps-pipeline"
version = "0.1.0"
description = "Offline data pipeline for the CLPS Lunar Mission Browser"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "spiceypy>=8.2",
  "numpy>=2.2",
  "scipy>=1.14",
  "rasterio>=1.4",
  "pyproj>=3.7",
  "requests>=2.32",
  "pyyaml>=6.0",
  "pillow>=11",
  "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

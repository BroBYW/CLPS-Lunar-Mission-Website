# Published points used only for validation (PLAN.md §12, item 4). Not shipped to the web app.
# sun_mean: time-averaged visible fraction of the solar disk (%); sun_any: % of time any part visible;
# sun_full: % of time the whole disk is visible; earth_*: the same for Earth. longest_dark_h: hours.
# sun_lit: % of time lit by the study's own definition (Bussey: partial blockage via a sigmoid; Speyerer: image-based).
# height_m: observer height used by the study. span: the period the study covered, where known.

studies:
  bussey2010: {label: "Bussey et al. 2010", dem: "Kaguya, 474 m/px", step: "12 h", span: [2017, 2037], span_note: "study period differs; 2017–2037 used as a full nodal cycle"}

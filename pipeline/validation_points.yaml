  speyerer2013: {label: "Speyerer & Robinson 2013", dem: "WAC images, 100 m/px", step: "images", span: [2017, 2037], span_note: "image-based over about one year; not like-for-like"}
  glaser2014: {label: "Gläser et al. 2014", dem: "LOLA, 20 m/px", step: "1 h", span: [2017, 2036], span_note: "19 years; exact years not in the abstract"}
  glaser2018: {label: "Gläser et al. 2018", dem: "LOLA, 20 m/px", step: "1 h", span: [2017, 2037]}
  bryant2009: {label: "Bryant 2009", dem: "Goldstone radar, 40 m", step: "multiyear", span: [2017, 2037], span_note: "multiyear averages; pre-LOLA coordinates"}

